# Deployments in namespace chub-intake. Image tags are substituted by the release pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fnol-intake-svc
  namespace: chub-intake
  labels:
    app.kubernetes.io/name: fnol-intake-svc
    app.kubernetes.io/part-of: claims-hub
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: fnol-intake-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fnol-intake-svc
        app.kubernetes.io/part-of: claims-hub
    spec:
      serviceAccountName: fnol-intake-svc
      containers:
        - name: fnol-intake-svc
          image: registry.corvane.internal/chub/fnol-intake-svc:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fnol-intake-svc-config
            - configMapRef:
                name: esp-prd-client
            - secretRef:
                name: fnol-intake-svc-db
          resources:
            requests:
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-svc
  namespace: chub-intake
  labels:
    app.kubernetes.io/name: triage-svc
    app.kubernetes.io/part-of: claims-hub
spec:
