      containers:
        - name: triage-svc
          image: registry.corvane.internal/chub/triage-svc:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: triage-svc-config
            - configMapRef:
                name: esp-prd-client
            - secretRef:
                name: triage-svc-db
          resources:
            requests:
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
