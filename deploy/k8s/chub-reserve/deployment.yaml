# Deployments in namespace chub-reserve. Image tags are substituted by the release pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reserve-engine
  namespace: chub-reserve
  labels:
    app.kubernetes.io/name: reserve-engine
    app.kubernetes.io/part-of: claims-hub
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: reserve-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reserve-engine
        app.kubernetes.io/part-of: claims-hub
    spec:
      serviceAccountName: reserve-engine
      containers:
        - name: reserve-engine
          image: registry.corvane.internal/chub/reserve-engine:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: reserve-engine-config
            - configMapRef:
                name: esp-prd-client
            - secretRef:
                name: reserve-engine-db
          resources:
            requests:
              cpu: 500m
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
