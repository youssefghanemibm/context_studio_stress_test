apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-svc-config
  namespace: chub-settle
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: settlement-svc-db.chub-settle.svc
  DB_NAME: chub_settlement
  KAFKA_CLUSTER: esp-prd
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
