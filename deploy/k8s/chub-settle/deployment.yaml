# Deployments in namespace chub-settle. Image tags are substituted by the release pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-svc
  namespace: chub-settle
  labels:
    app.kubernetes.io/name: settlement-svc
    app.kubernetes.io/part-of: claims-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settlement-svc
        app.kubernetes.io/part-of: claims-hub
    spec:
      serviceAccountName: settlement-svc
      containers:
        - name: settlement-svc
          image: registry.corvane.internal/chub/settlement-svc:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: settlement-svc-config
            - configMapRef:
                name: esp-prd-client
            - secretRef:
                name: settlement-svc-db
          resources:
            requests:
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
---
