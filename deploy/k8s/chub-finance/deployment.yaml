# Deployments in namespace chub-finance. Image tags are substituted by the release pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gl-posting-svc
  namespace: chub-finance
  labels:
    app.kubernetes.io/name: gl-posting-svc
    app.kubernetes.io/part-of: claims-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gl-posting-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gl-posting-svc
        app.kubernetes.io/part-of: claims-hub
    spec:
      serviceAccountName: gl-posting-svc
      containers:
        - name: gl-posting-svc
          image: registry.corvane.internal/chub/gl-posting-svc:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gl-posting-svc-config
            - configMapRef:
                name: esp-prd-client
            - secretRef:
                name: gl-posting-svc-db
          resources:
            requests:
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
---
