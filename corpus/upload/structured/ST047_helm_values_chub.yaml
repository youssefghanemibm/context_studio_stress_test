# Corvane Mutual – Helm Values – Claims Hub
# Document SKR-PLT-HLM-047 version 1.0 (approved), 2026-10-20
# Owner: Nadia Petrovic, Java Technical Lead
# Classification: Internal – Programme Skerry
# Change history:
#   0.1  2026-06-27  Nadia Petrovic: Initial draft for review
#   0.2  2026-07-03  Nadia Petrovic: Updated after design review
#   0.3  2026-07-07  Nadia Petrovic: Clarified ownership fields
#   0.4  2026-08-18  Nadia Petrovic: Added missing entries
