#   1.0  2026-10-20  Nadia Petrovic: Approved
# Helm values for the claims-hub umbrella chart (prod). Per-environment overrides live next to this file.
global:
  environment: prod
  cluster: ocp-prd-lon1
  drCluster: ocp-dr-lds1
  imageRegistry: registry.corvane.internal/chub
  imagePullPolicy: IfNotPresent
  kafka:
    bootstrapServers: esp-prd-kafka-bootstrap.esp.svc:9093
    securityProtocol: SASL_SSL
    schemaRegistry: https://schema-registry.esp.svc:8081
  identity:
    issuer: https://cis.corvane.internal
    audience: claims-hub
  observability:
    tracing: true
    metricsPath: /actuator/prometheus
    logFormat: json
  defaultResources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  podDisruptionBudget:
    minAvailable: 1
  secrets:
    provider: external-secrets
    placeholder: <REDACTED>
services:
  claim-core-svc:
    enabled: true
    image:
      repository: registry.corvane.internal/chub/claim-core-svc
      tag: r2026.09.2
    replicaCount: 3
    namespace: chub-core
    labels:
      app.kubernetes.io/part-of: claims-hub
      corvane.example/squad: Hub Squad – Intake & Triage
    service:
      port: 8080
      managementPort: 8081
    ingress:
      enabled: true
      host: claim-core-svc.apps.ocp-prd-lon1.corvane.internal
      tls: true
    database:
      name: chub_claim_core
      schemaTables:
      - claim_core.claim
      - claim_core.party
      credentialsSecret: claim-core-svc-db
    kafka:
      produces:
      - claim.created.v1
      - claim.updated.v1
      consumes:
      - fnol.received.v1
      - notification.sent.v1
      consumerGroup: claim-core-svc
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    probes:
      readiness: /actuator/health/readiness
      liveness: /actuator/health/liveness
    env:
      SPRING_PROFILES_ACTIVE: prod
      MANAGEMENT_SERVER_PORT: '8081'
      OTEL_SERVICE_NAME: claim-core-svc
      TZ: UTC
    networkPolicy:
      allowIngressFrom:
      - openshift-ingress
      - chub-monitoring
      allowEgressTo:
      - esp
      - cis
      - chub-core-db
  fnol-intake-svc:
