# Data contract between the MQ-to-Kafka bridge and its consumers.
dataContractSpecification: 0.9.3
id: urn:corvane:contract:clx-if-049
schemaVersion: 3
key: claim_id
amounts: minor units
info:
  title: Reserve Movement Kafka Bridge (CLX-IF-049)
  version: 3.0.0
  status: approved
  owner: Integration Platform
  interfaceOwner: Henrik Vestergaard
  author: Marcus Oduya
  date: '2025-12-12'
  description: Batch-to-event bridge (ADR-012); consumed by reserve-svc for parallel-run reconciliation and Wave
    2 sync. In practice, structured logs carry a correlation identifier end to end.
source:
  interface: CLX-IF-042
  name: Reserve Movement Daily Extract
  layout: RSVMOVE copybook
  queue: CLR.RSVMOVE.OUT
  queueManager: CLRQM01
  recordVersion: '02'
  system: CLARA
target:
  topic: claims.reserve.movement.v1
  cluster: esp-prd
  format: Avro
  subject: claims.reserve.movement.v1-value
  compatibility: BACKWARD
producer: MQ-to-Kafka bridge (CLX-IF-049)
consumers:
- reserve-svc
schedule: daily 02:45
decisions:
- ADR-012 batch-to-event bridge
- ADR-017 replaces CDC (ADR-005)
- DEC-017 (Design Authority 2025-10-21)
ticket: CHUB-188
fields:
- name: claim_id
  type: string
  source: RM-CLAIM-ID
  description: Claim reference; message key
  required: true
- name: reserve_id
  type: long
  source: RM-RSV-ID
  description: CLARA reserve identifier
  required: true
- name: movement_id
  type: long
  source: RM-MOVE-ID
  description: CLARA movement identifier (idempotency key)
  required: true
- name: movement_type
  type: enum
  source: RM-MOVE-TYPE
  description: IN, AD, IX, RV, ST or RC
  required: true
- name: currency
  type: string
  source: RM-CURRENCY
  description: ISO 4217 currency of the reserve
  required: true
- name: amount_minor
  type: long
  source: RM-AMOUNT
  description: Movement amount in minor units (RM-AMOUNT x 100)
  required: true
- name: gbp_amount_minor
  type: long
  source: RM-GBP-AMOUNT
  description: GBP equivalent in pence (RM-GBP-AMOUNT x 100)
  required: true
- name: product
  type: string
  source: RM-PRODUCT
  description: Product code
  required: true
- name: peril
  type: string
  source: RM-PERIL
  description: Peril (claim type) code
  required: true
- name: tier
  type: string
  source: RM-TIER
  description: Claim tier at extract time
  required: true
- name: movement_ts
  type: timestamp-millis
  source: RM-MOVE-TS
  description: Movement time stamp converted to UTC
  required: true
- name: extract_date
  type: date
  source: RM-EXTRACT-DATE
  description: Business date of the CLX-IF-042 extract
  required: true
- name: record_version
  type: int
  source: RM-REC-VERSION
  description: RSVMOVE record version (02)
  required: true
quality:
- Every message has a non-empty claim_id key.
- amount_minor equals RM-AMOUNT multiplied by 100 with the sign preserved.
- movement_id is unique per extract date; replays are de-duplicated by the consumer.
- record_version is 02; any other value is rejected to the dead-letter topic.
