lineage:
- step: 1
  system: CLARA
  what: CLRRS170 (job CLRNRSV3) extracts reserve movements from CLR.T_RESERVE_MOVEMENT
- step: 2
  system: MQ Backbone
  what: RSVMOVE records are put to queue CLR.RSVMOVE.OUT on CLRQM01 (CLX-IF-042)
- step: 3
  system: Event Streaming Platform
  what: The bridge converts each record to Avro and publishes it keyed by claim_id (CLX-IF-049)
- step: 4
  system: Claims Hub
  what: reserve-svc consumes the topic and applies movements idempotently on movement_id
