# Owner: Nadia Petrovic, Java Technical Lead
# Classification: Internal – Programme Skerry
# Change history:
#   0.1  2026-02-13  Nadia Petrovic: Initial draft for review
#   0.2  2026-03-18  Nadia Petrovic: Cross-checked against the source systems
#   1.0  2026-06-01  Nadia Petrovic: Approved
# .github/workflows/claims-hub-ci.yml
# Services built by this workflow: claim-core-svc, fnol-intake-svc, triage-svc, assessment-svc, reserve-engine, fraud-referral-svc, settlement-svc, payment-orchestrator, recovery-svc, document-svc, notification-svc, gl-posting-svc, reporting-feed-svc
# Production promotion is a separate, CAB-approved workflow.
name: claims-hub-ci
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      service:
        description: Build a single service
        required: false
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  JAVA_VERSION: '21'
  REGISTRY: registry.corvane.internal/chub
  GITOPS_REPO: corvane/platform-config
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@v4
    - id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |-
          claim-core-svc: services/claim-core-svc/**
          fnol-intake-svc: services/fnol-intake-svc/**
          triage-svc: services/triage-svc/**
          assessment-svc: services/assessment-svc/**
          reserve-engine: services/reserve-engine/**
          fraud-referral-svc: services/fraud-referral-svc/**
          settlement-svc: services/settlement-svc/**
          payment-orchestrator: services/payment-orchestrator/**
          recovery-svc: services/recovery-svc/**
          document-svc: services/document-svc/**
          notification-svc: services/notification-svc/**
          gl-posting-svc: services/gl-posting-svc/**
          reporting-feed-svc: services/reporting-feed-svc/**
  build-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven
    - name: Unit and integration tests
      run: mvn -B -pl services/${{ matrix.service }} -am verify
    - name: Publish test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-${{ matrix.service }}
        path: services/${{ matrix.service }}/target/surefire-reports
  contract-tests:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: OpenAPI contract tests
      run: mvn -B -P contract-tests verify
    - name: Kafka consumer contract tests (ADR-023)
      run: mvn -B -P kafka-contracts verify
  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Dependency scan
      run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8
    - name: Secret scan
      run: gitleaks detect --no-banner --redact
  legacy-clara-checks:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'legacy/clara/')
    steps:
    - uses: actions/checkout@v4
    - name: Copybook and JCL lint
      run: ./tools/clara-lint.sh legacy/clara
    - name: Program inventory drift check
      run: ./tools/inventory-diff.sh legacy/clara/cobol
  image:
    needs:
    - contract-tests
    - security-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t $REGISTRY/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
    - name: Push image
      env:
        REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      run: echo "$REGISTRY_TOKEN" | docker login registry.corvane.internal -u ci --password-stdin && docker push
        $REGISTRY/${{ matrix.service }}:${{ github.sha }}
  lint:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven
    - name: Formatting check
      run: mvn -B spotless:check
    - name: Static analysis
      run: mvn -B -DskipTests checkstyle:check spotbugs:check
  api-compatibility:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: OpenAPI breaking-change check against main
      run: ./tools/openapi-diff.sh origin/main HEAD services/*/src/main/resources/openapi.yaml
    - name: Avro schema compatibility (BACKWARD)
      run: ./tools/avro-compat.sh --level BACKWARD schemas/
  db-migrations:
    needs: build-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
        - 5432:5432
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate Flyway migrations
      run: mvn -B -pl services/${{ matrix.service }} flyway:validate -Pci-db
  sbom:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate CycloneDX SBOM
      run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: target/bom.json
  deploy-dev:
    needs: image
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Open GitOps pull request
      run: ./tools/gitops-bump.sh dev ${{ github.sha }}
  smoke-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - uses: actions/checkout@v4
    - name: Wait for Argo CD sync
      run: ./tools/argocd-wait.sh claims-hub-dev --timeout 900
    - name: Smoke tests
      run: ./tools/smoke.sh dev
  notify:
    needs:
    - smoke-dev
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: Post failure to the squad channel
      run: ./tools/notify-failure.sh "${{ github.workflow }}" "${{ github.run_id }}"
