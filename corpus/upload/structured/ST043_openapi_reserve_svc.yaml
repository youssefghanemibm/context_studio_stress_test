x-data-model:
  note: Persistence owned by the service (PostgreSQL); not exposed directly to consumers.
  tables:
  - table: reserve.reserve
    database: chub_reserve
    columns:
    - name: reserve_id
      type: UUID
      nullable: false
      description: Reserve
      primaryKey: true
    - name: claim_id
      type: VARCHAR(20)
      nullable: false
      description: Claim
    - name: reserve_type
      type: VARCHAR(10)
      nullable: false
      description: Indemnity, expense, legal
    - name: currency
      type: CHAR(3)
      nullable: false
      description: Currency
    - name: outstanding_amount
      type: NUMERIC
      nullable: false
      description: Outstanding (maps from RSV_OUTSTANDING_AMT)
    - name: gbp_equivalent
      type: NUMERIC
      nullable: false
      description: GBP equivalent
    - name: next_review_date
      type: DATE
      nullable: true
      description: Next review
    - name: status
      type: VARCHAR(8)
      nullable: false
      description: Open or closed
  - table: reserve.reserve_movement
    database: chub_reserve
    columns:
    - name: movement_id
      type: UUID
      nullable: false
      description: Movement
      primaryKey: true
