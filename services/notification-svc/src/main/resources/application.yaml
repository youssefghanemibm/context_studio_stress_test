# notification-svc - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: notification-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_notification
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-svc
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - fnol.received.v1
      - fraud.referral.notice-due.v1
    produces:
      - notification.sent.v1
      - notification.fraud-notice.sent.v1
  postgres-tables:
    - notification.message

notify:
  base-url: ${NOTIFY_BASE_URL}
  # ADR-014: fraud-referral notices use Notify templates
  templates:
    fraud-notice-letter: FRN01
    fraud-notice-sms: FRN02

notice:
  business-days: 10
  holiday-calendars: [UK, NO, SE, DK]
  # CHUB-421: event published once a fraud-referral notice has been sent
  sent-event-topic: notification.fraud-notice.sent.v1
