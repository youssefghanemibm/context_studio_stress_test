# reserve-engine - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: reserve-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_reserve
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: reserve-engine
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - claims.reserve.movement.v1
      - triage.completed.v1
    produces:
      - reserve.changed.v2
  postgres-tables:
    - reserve.reserve
    - reserve.reserve_movement
    - reserve.review_schedule

reserve:
  # BR-RSV-007 v3 (effective 2026-07-01), CHUB-322
  tier3-review-days: 14
  large-loss-threshold-gbp: 250000
  # ADR-028 / DEC-005: revaluations are posted as RV reserve movements
  revaluation:
    movement-type: RV
    rate-source: GROUP_LEDGER_MONTH_END
