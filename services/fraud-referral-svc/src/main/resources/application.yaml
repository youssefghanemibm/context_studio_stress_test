# fraud-referral-svc - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: fraud-referral-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_fraud
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: fraud-referral-svc
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - fraud.score.received.v1
      - triage.completed.v1
    produces:
      - fraud.referral.created.v1
      - fraud.referral.notice-due.v1
  postgres-tables:
    - fraud.referral
    - fraud.customer_notice
