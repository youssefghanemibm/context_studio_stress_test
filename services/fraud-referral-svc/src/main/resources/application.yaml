# fraud-referral-svc - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: fraud-referral-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_fraud
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: fraud-referral-svc
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - fraud.score.received.v1
      - triage.completed.v1
    produces:
      - fraud.referral.created.v1
      - fraud.referral.notice-due.v1
  postgres-tables:
    - fraud.referral
    - fraud.customer_notice

referral:
  # ADR-020: effective-dated thresholds for BR-FRD-031 (Sentinel score 0-100)
  threshold.default: 65
  siu:
    # BR-FRD-035 v2
    triage-business-days: 3

notice:
  # BR-FRD-032 v2 (NISA Circular 2026/04): written notice within 10 business days of referral
  business-days: 10
  # BR-FRD-036: deferral where SIU certifies a tipping-off risk
  max-deferral-days: 60

auto-decline:
  # BR-FRD-033: no decline on the score alone
  enabled: false
