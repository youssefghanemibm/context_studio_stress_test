# reporting-feed-svc - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: reporting-feed-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_reporting
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: reporting-feed-svc
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - reserve.changed.v1
      - fraud.referral.created.v1
    produces: []
  postgres-tables:
    - reporting.return_extract

reporting:
  target: NISA Reporting Hub
  returns: [TP2, FR1, CT1]
