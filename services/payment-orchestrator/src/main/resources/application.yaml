# payment-orchestrator - Claims Hub service configuration (profile-independent defaults).
# Secrets are injected at deploy time from the platform secret store; never commit values.
spring:
  application:
    name: payment-orchestrator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/chub_payment
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: payment-orchestrator
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chub:
  kafka:
    cluster: esp-prd
    consumes:
      - settlement.agreed.v1
      - payment.confirmed.v1
    produces:
      - payment.requested.v1
  postgres-tables:
    - payment.payment_instruction

cpg:
  base-url: ${CPG_BASE_URL}
  # CLX-IF-038: ISO 20022 pain.001 JSON mapping
  instruction-format: pain.001
