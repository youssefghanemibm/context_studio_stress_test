- id: BR-TRI-003
  area: TRI
  title: Claim tier classification (Tier-1 / Tier-2 / Tier-3)
  owner: P011
  versions:
  - version: 1
    status: superseded
    effective_from: '2016-01-01'
    effective_to: '2021-12-31'
    text: 'Tier-3: estimated incurred ≥ £25,000 or any bodily injury. Tier-2: £5,000–£24,999. Tier-1: below £5,000 with no injury.'
    parameters:
      tier3_min_gbp: 25000
      tier2_min_gbp: 5000
    approved_by:
    - P011
    approved_on: '2015-11-20'
    source: Claims Handling Manual v5.0 §3.2
  - version: 2
    status: superseded
    effective_from: '2022-01-01'
    effective_to: '2024-12-31'
    text: 'Tier-3: estimated incurred ≥ £40,000 (NOK 500,000 / SEK 500,000 / DKK 340,000) or any bodily injury. Tier-2: £5,000–£39,999 or any
      third-party involvement. Tier-1: otherwise.'
    parameters:
      tier3_min_gbp: 40000
      tier3_min_nok: 500000
      tier3_min_sek: 500000
      tier3_min_dkk: 340000
      tier2_min_gbp: 5000
    approved_by:
    - P011
    approved_on: '2021-11-16'
    source: Claims Handling Manual v6.1 §2.4
  - version: 3
    status: approved
    effective_from: '2025-01-01'
    effective_to: null
    text: 'A claim is Tier-3 if any of: estimated incurred ≥ £50,000 (NOK 650,000 / SEK 680,000 / DKK 430,000); any bodily injury; solicitor or
      litigation involvement at notification; property total loss. Tier-2: £5,000–£49,999 or any third-party involvement. Tier-1: below £5,000,
      no injury, no third party.'
    parameters:
      tier3_min_gbp: 50000
      tier3_min_nok: 650000
      tier3_min_sek: 680000
      tier3_min_dkk: 430000
      tier2_min_gbp: 5000
      tier3_triggers:
      - incurred_threshold
      - bodily_injury
      - litigation_at_notification
      - property_total_loss
    approved_by:
    - P005
    approved_on: '2024-11-26'
    source: Claims Standards Bulletin CSB-2024-11; Claims Handling Manual v7.2 §2.4 (Definitions)
  supersedes: []
  superseded_by: null
  implemented_in:
