headline_questions:
  Q1:
    question: Which programs write to the reserve table?
    answer: 'Eight programs write CLR.T_RESERVE: CLRFN030, CLRRS010, CLRRS020, CLRRS110, CLRRS130, CLRST040, CLRRC050, CLRGL090. CLRRS150 writes
      only CLR.T_RESERVE_MOVEMENT; the data dictionary omits CLRGL090.'
    world_refs:
    - TABLE:CLR.T_RESERVE#writers
  Q2:
    question: Which rules govern fraud referral since the 2026 regulatory change?
    answer: 'From 2026-04-01 (NISA Circular 2026/04): BR-FRD-031 (refer at Sentinel score ≥ 65; v2 from 2026-10-01 adds ≥ 60 for Tier-3 claims
      as defined by BR-TRI-003), BR-FRD-032 (customer notice within 10 business days), BR-FRD-033 (no adverse decision on score alone), BR-FRD-034
      (quarterly NISA-FR1 within 30 days), BR-FRD-035 v2 (SIU triage within 3 business days), BR-FRD-036 (deferral up to 60 days; > 30 days needs
      the Head of Counter-Fraud & SIU from 2026-10-01). BR-FRD-012 was superseded and BR-FRD-019 (auto-decline) withdrawn on 2026-03-31.'
    world_refs:
    - RULE:BR-FRD-031
    - RULE:BR-FRD-032
    - RULE:BR-FRD-033
    - RULE:BR-FRD-034
    - RULE:BR-FRD-035
    - RULE:BR-FRD-036
  Q3:
    question: What breaks downstream if interface CLX-IF-042 changes?
    answer: 'Hop 1: CLX-IF-043 (GL Reserve Journal Feed), CLX-IF-044 (CDW Reserve Fact Load), CLX-IF-047 (Reserve Cession Feed), CLX-IF-049 (Reserve
      Movement Kafka Bridge → reserve-engine). Hop 2: CLX-IF-051 (Technical Provisions Feed to NISA Reporting Hub), CLX-IF-055 (Monthly Claims
      Bordereaux to reinsurers), CLX-IF-058 (Reserve Triangles Extract to ARW). Hop 3: the NISA-TP2 quarterly return and the Reserving team''s
      monthly IBNR run. Teams: Financial Control, Data & Analytics, Reinsurance, Hub Squad – Reserve & Finance, Regulatory Reporting, Reserving.'
    world_refs:
    - INTERFACE:CLX-IF-042#dependents
    impact:
      hop1:
      - CLX-IF-043
      - CLX-IF-044
      - CLX-IF-047
      - CLX-IF-049
      hop2:
      - CLX-IF-051
      - CLX-IF-055
      - CLX-IF-058
      systems:
      - SYS06
      - SYS11
      - SYS07
      - SYS15
      - SYS02
      - SYS10
      - SYS26
      - SYS21
      reports:
      - NISA-TP2
      teams:
      - T14
      - T23
      - T17
      - T28
      - T15
      - T12
      services:
      - reserve-engine
  Q4:
    question: Who owns the subrogation process?
    answer: Freya Lindahl, Head of Recoveries & Subrogation, since 2025-09-01 (Siobhan Quill acting 2025-01-01..2025-08-31; Martin Calloway until
      2024-12-31, still shown on the stale 2024 org chart).
