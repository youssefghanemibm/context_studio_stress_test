# Graph expectations for the Corvane corpus (curated from questions/graph_expectations.draft.yaml).
# Format: questions/GRAPH_EXPECTATIONS_FORMAT.md. Types and relationships: schemas/corvane_claims.jsonld.
# Audit:  .venv/bin/python -I harness/graph_audit.py audit <export.json> --expect questions/graph_expectations.yaml
# Consistency proof: harness/make_perfect_export.py builds a graph from the world model alone; auditing it
# against this file must give 0 missing nodes, 0 missing edges, 0 unmerged aliases and 0 wrong merges.
#   .venv/bin/python -I harness/make_perfect_export.py && .venv/bin/python -I harness/graph_audit.py audit \
#       build/perfect_export.json --expect questions/graph_expectations.yaml --label perfect
#   Result (2026-11-16): 132/132 nodes present, 141/141 edges present, 130/130 merge groups merged, 8/8
#   must-not-merge groups kept apart, 0 must-not-exist hits. Each node, merge group and must-not-merge entry
#   also resolves to exactly the world entity its world_ref names (the two Callum Fairbairn nodes to P022/P051).
#
# Scope (132 nodes, 141 edges, 130 merge groups, 8 must-not-merge, 49 must-not-exist):
# - nodes: every person with manifest evidence in 2+ corpus files, the systems with evidence in 2+ files, the
#   CLX-IF-042 impact chain (root + hops 1-2) and NISA-TP2, the eight reserve-table writers plus CLRRS150 and
#   CLRRS170, CLR.T_RESERVE / CLR.T_RESERVE_MOVEMENT, the versioned rules the headline questions and planted
#   contradictions use, the seven process stages, the 13 Claims Hub services and two NISA circulars (2026/04, 2024/07).
# - edges: REPORTS_TO and OWNS_PROCESS as of 2026-11-15 (current lines only; stale chart lines are NOT expected),
#   WRITES_TO_TABLE for the reserve writers, CALLS_PROGRAM chains stated in the corpus, the CLX-IF-042
#   DEPENDS_ON_INTERFACE / SOURCE_SYSTEM / TARGET_SYSTEM / FEEDS_REPORT chain, SUPERSEDES, HAS_VERSION,
#   GOVERNED_BY, RENAMED_TO, REPLACES_PROGRAM, NEXT_STEP, OWNS_INTERFACE and CONSUMES_INTERFACE on the CLX-IF-042
#   chain, IMPLEMENTS_RULE, OWNS_RULE and CONSUMES_TOPIC.
# - Rename policy: system, service, person and team renames are merge_expected groups (one node per entity);
#   COBOL program-id renames (FNETCAL1 -> CLRFR020 ...) are RENAMED_TO edges between two Program nodes.
# - Every node and edge cites manifest fact ids (manifests/*.facts.yaml; rejected-format facts excluded).
#   Items without corpus evidence were dropped (e.g. OWNS_PROCESS for S2/S3/S5/S6, Vehicle Data Service).
