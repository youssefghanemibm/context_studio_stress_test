- id: Q-CODE-014
  category: contradiction
  variant: a
  dimensions: [code, connector, contradiction, multi_hop]
  question: "In the CLARA sources, how do the online fraud referral program CLRFR030 and the nightly batch sweep CLRFR040 obtain their referral threshold, and does either disagree with the CLR.T_PARAM values?"
  expected_answer: "CLRFR030 reads FRD_REFER_THRESH and FRD_REFER_T3_THRESH from CLR.T_PARAM through CALL 'CLRCM040' in paragraph 2000-GET-THRESHOLDS, so it uses 65, and 60 for Tier-3 claims from 2026-10-01. CLRFR040 ignores T_PARAM and hard-codes 05 WS-REFER-THRESHOLD PIC 9(3) VALUE 070, so it refers only at a Sentinel score of 70 or more. CLRFR040 is the one that disagrees: the authoritative threshold is 65 (60 for Tier-3), and the constant is the code-drift defect CHUB-298."
  acceptable_variants:
    - "CLRFR030 uses CLRCM040 to read the T_PARAM thresholds (65; 60 for Tier-3); CLRFR040 hard-codes 070 instead of the 65 in T_PARAM."
  must_include: [["CLRCM040"], ["70"], ["65"]]
  must_not_include: []
  evidence:
    - {fact_id: CL-CLRFR030-F001}
    - {fact_id: CL-CLRFR040-F001}
    - {fact_id: CL-T_PARAM_seed-F002}
    - {fact_id: CL-T_PARAM_seed-F001}
  hops: 4
  ask_mode: chat
  difficulty: hard
  world_refs: [CONTRA:C05, PROGRAM:CLRFR040#hardcoded_constants, PROGRAM:CLRFR030, TABLE:CLR.T_PARAM, RULE:BR-FRD-031@v2]
  trap: "C05 code drift, variant a only: CM-09 (variant c) removes the constant. Authoritative value is 65 per LD001 and T_PARAM (60 for Tier-3 from 2026-10-01). The T_PARAM seed also holds the end-dated 70 row (2023-04-01..2026-03-31), which matches the constant only by history."

