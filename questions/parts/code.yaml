- id: Q-CODE-001
  category: code_fact
  variant: a
  dimensions: [code, connector, aggregation, multi_hop]
  question: "Going by the EXEC SQL statements in the CLARA COBOL sources, which programs INSERT rows into CLR.T_RESERVE and which ones UPDATE it?"
  expected_answer: "Eight programs: CLRFN030 and CLRRS010 (INSERT), and CLRRS020, CLRRS110, CLRRS130, CLRST040, CLRRC050 and CLRGL090 (UPDATE). CLRRS150 is not one of them; it only inserts correction rows into CLR.T_RESERVE_MOVEMENT."
  acceptable_variants:
    - "CLRFN030, CLRRS010, CLRRS020, CLRRS110, CLRRS130, CLRST040, CLRRC050, CLRGL090"
  must_include: [["CLRFN030"], ["CLRRS010"], ["CLRRS020"], ["CLRRS110"], ["CLRRS130"], ["CLRST040"], ["CLRRC050"], ["CLRGL090"]]
  must_not_include: []
  evidence:
    - {fact_id: CL-CLRFN030-F001}
    - {fact_id: CL-CLRRS010-F002}
    - {fact_id: CL-CLRRS020-F001}
    - {fact_id: CL-CLRRS110-F001}
    - {fact_id: CL-CLRRS130-F001}
    - {fact_id: CL-CLRST040-F001}
    - {fact_id: CL-CLRRC050-F001}
    - {fact_id: CL-CLRGL090-F001}
  hops: 8
  ask_mode: chat
  difficulty: hard
  world_refs: [TABLE:CLR.T_RESERVE#writers]
  trap: "The 2025-02-14 data dictionary ST001 lists only seven writers and omits CLRGL090 (C08); TX003 first says 'only the CLRRS programs' (C07). CLRRS150 touches only CLR.T_RESERVE_MOVEMENT. Several writers use SELECT ... FROM FINAL/OLD TABLE (UPDATE ...), which a naive parser may count as reads only."

- id: Q-CODE-002
  category: multi_hop
  variant: a
  dimensions: [code, connector, multi_hop]
  question: "How does the CLARA program CLRRS110 get its Tier-3 reserve review cadence: which subprogram does it call, which DB2 table and parameter key are read, and what cadence applies today?"
  expected_answer: "CLRRS110 (paragraph 2000-SCHEDULE) moves RSV_T3_REVIEW_DAYS into PARM-PARAM-KEY and calls CLRCM040, the parameter reader, which selects the CLR.T_PARAM row valid on the current date. The row valid from 2026-07-01 (CHUB-318) holds 14, so Tier-3 reviews are scheduled every 14 days; CLRRS110 then updates RSV_NEXT_REVIEW_DT on CLR.T_RESERVE."
  acceptable_variants:
    - "Via CALL 'CLRCM040', which reads RSV_T3_REVIEW_DAYS from CLR.T_PARAM; currently 14 days."
  must_include: [["CLRCM040"], ["CLR.T_PARAM", "T_PARAM"], ["RSV_T3_REVIEW_DAYS"], ["14 day", "14 days", "fortnight", "two weeks", "is 14", "of 14", "value 14"]]
  must_not_include: ["21 days", "30 days"]
  evidence:
    - {fact_id: CL-CLRRS110-F001}
    - {fact_id: CL-CLRCM040-F001}
    - {fact_id: CL-T_PARAM_seed-F004}
  hops: 3
  ask_mode: chat
  difficulty: medium
  world_refs: [PROGRAM:CLRRS110, PROGRAM:CLRCM040, TABLE:CLR.T_PARAM, RULE:BR-RSV-007@v3]
  trap: "The T_PARAM seed still carries the end-dated rows (30 days to 2023-12-31, 21 days 2024-01-01..2026-06-30); the superseded manual v6.1 says 30 days (C04)."

