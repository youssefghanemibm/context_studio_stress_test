- id: Q-CODE-012
  category: multi_hop
  variant: a
  dimensions: [code, connector, md, multi_hop]
  question: "Why was ADR-005 (change data capture on DB2 for reserve synchronisation) superseded, by which ADR, and what in the CLARA code causes the problem?"
  expected_answer: "ADR-005 proposed CDC on CLR.T_RESERVE_MOVEMENT and is superseded by ADR-017 (replace CDC with the batch-to-event bridge). The reason is CLRGL090: its paragraph 3000-REVALUE runs UPDATE CLR.T_RESERVE SET RSV_GBP_EQUIV_AMT and RSV_LAST_REVAL_DT directly and inserts no row into CLR.T_RESERVE_MOVEMENT, so CDC on the movement table would miss the revaluations."
  acceptable_variants:
    - "Superseded by ADR-017 because CLRGL090 updates RSV_GBP_EQUIV_AMT on CLR.T_RESERVE without writing a movement row, bypassing the movement table that CDC would watch."
  must_include: [["ADR-017"], ["CLRGL090"], ["RSV_GBP_EQUIV_AMT", "GBP equivalent", "GBP-equivalent"], ["CLR.T_RESERVE_MOVEMENT", "movement table", "movement row", "movements"]]
  must_not_include: []
  evidence:
    - {fact_id: CODEMOD-F125}
    - {fact_id: CODEMOD-F127}
    - {fact_id: CL-CLRGL090-F001}
  hops: 3
  ask_mode: chat
  difficulty: medium
  world_refs: [ADR:ADR-005, ADR:ADR-017, PROGRAM:CLRGL090]
  trap: "CLRGL090 has a comment that mentions CLR.T_RESERVE_MOVEMENT only to say nothing is inserted there; a parser that links on mentions will draw a false write edge."

