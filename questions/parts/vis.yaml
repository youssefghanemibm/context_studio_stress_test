# Question group VIS: visuals (connectors, swimlanes, raster labels, native charts, image tables,
# screenshots, grouped/rotated shapes, speaker notes, alt text, stale vs current org charts).
# Every expected answer was checked against the text at each evidence locator (harness/extract.py,
# OCR cache included) and against world/worldlib as-of helpers on 2026-11-15.

# ---------------------------------------------------------------------------------------------
# visual_arrow
# ---------------------------------------------------------------------------------------------
- id: Q-VIS-001
  category: visual_arrow
  dimensions: [visual, pptx, multi_hop]
  question: "Under the fraud referral flow that applies from 1 October 2026, what happens to a Tier-3 claim with a Sentinel score of 62?"
  expected_answer: "It is referred to SIU. It fails the 'Sentinel score ≥ 65?' check (No branch), goes on to the 'Tier-3 and score ≥ 60?' check, and the Yes branch of that check leads to 'Refer to SIU'."
  acceptable_variants:
    - "Referred to SIU via the Tier-3 and score ≥ 60 branch"
  must_include: [["Refer to SIU", "referred to SIU", "referred to the SIU", "SIU referral"]]
  must_not_include: []
  evidence:
    - {fact_id: VS007-F003}
    - {fact_id: VS007-F002}
  hops: 2
  ask_mode: chat
  difficulty: medium
  world_refs: ["RULE:BR-FRD-031@v2#parameters.tier3_threshold", "PROCESS:PS-FRD-01#decision"]
  trap: "The Yes/No meaning lives only on the connectors; a reader using only the 65 threshold (LD001 manual, BR-FRD-031 v1) would say the claim is not referred."

- id: Q-VIS-002
  category: visual_arrow
  dimensions: [visual, pptx, multi_hop]
  question: "A claim is notified with an estimated incurred of £30,000 and the claimant has a bodily injury. Using the tier classification decision tree, which tier is the claim, where is it routed, and how quickly?"
  expected_answer: "Tier-3: the £50,000 question is No, but 'Bodily injury?' is Yes, which leads to Tier-3. Tier-3 claims are routed to Major & Complex Loss within 4 hours (BR-TRI-004)."
  acceptable_variants: []
  must_include: [["Tier-3"], ["Major & Complex Loss", "Major and Complex Loss"], ["4 hours", "four hours"]]
  must_not_include: []
  evidence:
    - {fact_id: VS025-F008}
    - {fact_id: VS025-F003}
    - {fact_id: VS025-F012}
  hops: 3
  ask_mode: chat
  difficulty: medium
  world_refs: ["RULE:BR-TRI-003@v3#parameters.tier3_triggers", "RULE:BR-TRI-004@v1"]
  trap: "On amount alone £30,000 is Tier-2; the injury branch is carried only by the Yes/No connectors."

