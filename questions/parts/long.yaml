# Question group LONG: long documents (LD001–LD030).
# Long-range definitions, split facts, multi-page tables, headers/footers/footnotes, Word comments and
# tracked changes, the image-only scan (LD002), the two-column NISA filing (LD003), the legacy .doc
# wordings (LD004–LD011), authority/RACI tables and the raster-only facts in the field guide (LD021).

# ------------------------------------------------------------------ needle_long_range
- id: Q-LONG-001
  category: needle_long_range
  dimensions: [long_doc, docx, needle, multi_hop]
  question: "A UK home claim is notified with an estimated incurred of £45,000. There is no injury, no solicitor involvement and it is not a total loss. Under the current Claims Handling Manual, is it subject to the 14-day Tier-3 reserve review?"
  expected_answer: "No. The claim is not Tier-3: under BR-TRI-003 v3 a claim is Tier-3 only at an estimated incurred of £50,000 or more (or with bodily injury, solicitor or litigation involvement at notification, or a property total loss). At £45,000 it is Tier-2 (£5,000 to £49,999), so the 14-day Tier-3 review (BR-RSV-007 v3) does not apply."
  acceptable_variants:
    - "No, it is a Tier-2 claim because the Tier-3 threshold is £50,000, so the 14-day review does not apply."
  must_include:
    - ["Tier-2", "Tier 2", "not Tier-3", "not a Tier-3", "isn't Tier-3", "isn't a Tier-3", "below the Tier-3", "does not meet the Tier-3", "doesn't meet the Tier-3", "does not qualify", "below the 50,000", "under the 50,000", "below 50,000", "under 50,000", "below the threshold", "under the threshold", "not subject", "does not apply", "doesn't apply"]
    - ["50,000", "49,999"]
  must_not_include: ["40,000"]
  evidence:
    - {fact_id: LD001-F016}
    - {fact_id: LD001-F018}
    - {fact_id: LD001-F153}
  hops: 2
  ask_mode: chat
  difficulty: hard
  world_refs: ["RULE:BR-TRI-003@v3#parameters", "RULE:BR-RSV-007@v3#parameters.review_days"]
  trap: "The Tier-3 definition (§2.4, p.15) is about 256 pages away from the review rule (§19.4, p.271), which does not restate it. The 2021 CLARA spec (LD017) puts Tier-3 at £40,000, which would wrongly make this claim Tier-3 (C10)."

- id: Q-LONG-002
  category: needle_long_range
  dimensions: [long_doc, docx, needle, multi_hop]
  question: "In Claims Handling Manual v7.2, what is the Large Loss Notification Threshold (LLNT), and how quickly must Reinsurance be notified when a reserve movement exceeds it?"
  expected_answer: "The LLNT is a reserve movement of £250,000 on a single claim (BR-RSV-011 v2). Reinsurance must be notified within 24 hours of any reserve movement exceeding it, through ReCede, copied to the Reinsurance Manager."
  acceptable_variants:
    - "£250,000; notify Reinsurance within 24 hours."
  must_include:
    - ["250,000"]
    - ["24 hours"]
  must_not_include: ["200,000", "48 hours"]
  evidence:
    - {fact_id: LD001-F024}
    - {fact_id: LD001-F159}
  hops: 2
  ask_mode: vector
  difficulty: medium
  world_refs: ["RULE:BR-RSV-011@v2#parameters"]
  trap: "In the manual the LLNT amount is defined only in §2.6 (p.18); §22.3 (p.300) gives the 24-hour rule without restating the amount. Score retrieval on LD001 §2.6 and §22.3: other files state the full rule in one passage (LD003 p.67, LD024 p.17, LD026 p.8, ST005 Versions!F139, ST040, ST045, TX032, TX042/ST055 glossary, TX048), so retrieving one of them does not test the long-range join. The superseded v6.1 manual (LD012) says 48 hours and £200,000 (BR-RSV-011 v1)."

- id: Q-LONG-003
  category: needle_long_range
  dimensions: [long_doc, docx, needle, multi_hop]
  question: "A Hem Sverige home claim has an estimated incurred of SEK 700,000 and no other Tier-3 trigger. Under the current Claims Handling Manual, how often must its case reserve be reviewed?"
  expected_answer: "At least every 14 days. SEK 700,000 is above the Swedish Tier-3 threshold of SEK 680,000 (BR-TRI-003 v3), so the claim is Tier-3, and Tier-3 reserves must be reviewed at least every 14 days (BR-RSV-007 v3, from 1 July 2026)."
  acceptable_variants:
    - "Every 14 days, because it is a Tier-3 claim (Swedish threshold SEK 680,000)."
  must_include:
    - ["14 days", "14-day", "fortnight", "two weeks"]
    - ["Tier-3"]
  must_not_include: ["21 days", "30 days"]
  evidence:
    - {fact_id: LD001-F016}
    - {fact_id: LD001-F153}
  hops: 2
  ask_mode: chat
  difficulty: hard
  world_refs: ["RULE:BR-TRI-003@v3#parameters.tier3_min_sek", "RULE:BR-RSV-007@v3#parameters.review_days"]
  trap: "The SEK threshold is in §2.4 (p.15; restated in §12.2, p.168), far from the review cadence in §19.4 (p.271). Stale cadences: 21 days (BR-RSV-007 v2, to 30 June 2026) and 30 days in the v6.1 manual (C04)."

- id: Q-LONG-004
  category: needle_long_range
  dimensions: [long_doc, docx, needle, multi_hop]
  question: "A UK motor claim has an estimated incurred of only £12,000, but it involves a bodily injury. How often must its reserve be reviewed under the current manual?"
  expected_answer: "At least every 14 days. Any bodily injury makes a claim Tier-3 under BR-TRI-003 v3, whatever the amount, and Tier-3 reserves must be reviewed at least every 14 days (BR-RSV-007 v3)."
  acceptable_variants:
    - "Every 14 days, because any bodily injury makes it a Tier-3 claim."
  must_include:
    - ["14 days", "14-day", "fortnight", "two weeks"]
    - ["Tier-3"]
  must_not_include: ["21 days", "30 days"]
  evidence:
    - {fact_id: LD001-F016}
    - {fact_id: LD001-F153}
  hops: 2
  ask_mode: chat
  difficulty: hard
  world_refs: ["RULE:BR-TRI-003@v3#parameters.tier3_triggers", "RULE:BR-RSV-007@v3#parameters.review_days"]
  trap: "The amount is below £50,000, so a system that only knows the monetary threshold will call it Tier-2. The bodily-injury trigger is in the §2.4 definition, about 256 pages before the review rule."

