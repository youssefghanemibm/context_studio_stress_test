- id: Q-LONG-005
  category: chunk_boundary
  dimensions: [long_doc, docx, chunk_boundary]
  question: "According to §18.1 of Claims Handling Manual v7.2, what reserve authority does each role hold, from Claims Handler to Claims Director?"
  expected_answer: "Claims Handler £25,000; Team Leader £100,000; Claims Manager £500,000; Claims Director £2,000,000. Above the Claims Director limit the case reserve must be approved by the Reserving Committee (BR-RSV-003 v3, effective 1 September 2025)."
  acceptable_variants: []
  must_include:
    - ["25,000"]
    - ["100,000"]
    - ["500,000"]
    - ["2,000,000"]
  must_not_include: ["400,000"]
  evidence:
    - {fact_id: LD001-F148}
    - {fact_id: LD001-F149}
  hops: 1
  ask_mode: vector
  difficulty: medium
  world_refs: ["RULE:BR-RSV-003@v3#parameters"]
  trap: "In the manual the sentence is broken by a page break right after 'Team Leader £100,000;' (p.260/261), so a chunk holding only the first half loses the Claims Manager and Claims Director limits. The unsplit sentence exists in the rule catalogues and decks (LD003 p.67, LD024 p.17, LD026 p.18, ST005 F126, ST040, ST043, ST045, TX032, VS008 alt text, VS016), so score retrieval on LD001 §18.1. The v2 limits (Claims Manager £400,000) are in the v6.1 manual and VS022."

