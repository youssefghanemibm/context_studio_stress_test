# HOP group: multi-hop chains (2-6 hops) across file types and the code repo, plus impact analysis.
# Written against the world model (as of 2026-11-15) and code variant a unless a question says otherwise.

# ---------------------------------------------------------------------------------------------
# Headline questions
# ---------------------------------------------------------------------------------------------

- id: Q-HOP-001
  category: multi_hop
  dimensions: [multi_hop, csv, pdf, code, txt, pptx, contradiction]
  question: "Which CLARA programs write to the reserve table CLR.T_RESERVE? Give the complete list."
  expected_answer: "Eight programs write CLR.T_RESERVE: CLRFN030, CLRRS010, CLRRS020, CLRRS110, CLRRS130, CLRST040, CLRRC050 and CLRGL090. CLRRS150 only writes CLR.T_RESERVE_MOVEMENT (it just reads the reserve table). The 2025 data dictionary lists only seven writers because it omits CLRGL090, whose year-end revaluation updates CLR.T_RESERVE without writing a movement (audit finding IA-25-07)."
  acceptable_variants:
    - "CLRFN030, CLRRS010, CLRRS020, CLRRS110, CLRRS130, CLRST040, CLRRC050, CLRGL090 (eight writers; the data dictionary misses CLRGL090)."
  must_include: [["CLRFN030"], ["CLRRS010"], ["CLRRS020"], ["CLRRS110"], ["CLRRS130"], ["CLRST040"], ["CLRRC050"], ["CLRGL090"]]
  must_not_include: []
  evidence:
    - {fact_id: ST019-F001}          # CRUD matrix: 8 writers incl. CLRGL090 (csv)
    - {fact_id: CL-CLRGL090-F010}    # CLRGL090 EXEC SQL UPDATE CLR.T_RESERVE (code)
    - {fact_id: LD024-F004}          # audit: data dictionary lists seven writers, CLRGL090 missing (pdf)
    - {fact_id: CL-CLRRS150-F001}    # CLRRS150 writes movements only (code)
    - {fact_id: TX003-F004}          # in-meeting correction: CLRFN030, CLRST040, CLRRC050, CLRGL090 also write (txt)
    - {fact_id: VS017-F003}          # connector CLRGL090 -> CLR.T_RESERVE 'UPDATE (year-end)' (pptx)
  hops: 4
  ask_mode: graph
  difficulty: hard
  world_refs: ["TABLE:CLR.T_RESERVE#writers", "PROGRAM:CLRGL090#writes_tables:CLR.T_RESERVE", "PROGRAM:CLRRS150#writes_tables", "CONTRA:C07", "CONTRA:C08"]
  trap: "The 2025 data dictionary (ST001) lists seven writers without CLRGL090; TX003 first claims only the CLRRS programs write it; CLRRS150 writes only the movement table."

- id: Q-HOP-002
  category: multi_hop
  dimensions: [multi_hop, pdf, html, docx, pptx, code, yaml, temporal]
  question: "Which business rules govern fraud referral since NISA Circular 2026/04 took effect, and what does each require?"
  expected_answer: "From 1 April 2026 (NISA Circular 2026/04): BR-FRD-031 (refer at a Sentinel score of 65 or more; v2 from 2026-10-01 refers Tier-3 claims at 60 or more, Tier-3 as defined by BR-TRI-003 v3); BR-FRD-032 v2 (tell the customer in writing within 10 business days of the referral); BR-FRD-033 (no decline, reduction or repudiation on the automated score alone; documented human review); BR-FRD-034 (quarterly NISA-FR1 return within 30 days of quarter end); BR-FRD-035 v2 (SIU triage within 3 business days); BR-FRD-036 (notice may be deferred up to 60 days for tipping-off risk; from 2026-10-01 deferrals beyond 30 days need the Head of Counter-Fraud & SIU). BR-FRD-012 (the old 70 threshold) was superseded and BR-FRD-019 (auto-decline) withdrawn."
  acceptable_variants: []
  must_include: [["BR-FRD-031"], ["BR-FRD-032"], ["BR-FRD-033"], ["BR-FRD-034"], ["BR-FRD-035"], ["BR-FRD-036"], ["Tier-3"]]
  must_not_include: ["5 business days"]
  evidence:
    - {fact_id: LD022-F007}          # circular effective 2026-04-01 (pdf)
    - {fact_id: ST059-F001}          # wiki: BR-FRD-031 v2, 032 v2, 033, 034, 036 v2 (html)
    - {fact_id: LD001-F193}          # BR-FRD-035 v2 triage 3 business days (docx)
    - {fact_id: VS007-F010}          # BR-FRD-019 withdrawn, BR-FRD-012 superseded (pptx)
    - {fact_id: VS007-F005}          # Tier-3 = BR-TRI-003 v3 (pptx notes)
    - {fact_id: CODEMOD-F003}        # fraud-referral-svc thresholds 65 / tier3 60 from 2026-10-01 (code)
  hops: 4
  ask_mode: chat
  difficulty: hard
  world_refs: ["RULE:BR-FRD-031", "RULE:BR-FRD-032", "RULE:BR-FRD-033", "RULE:BR-FRD-034", "RULE:BR-FRD-035", "RULE:BR-FRD-036", "CIRCULAR:CIRC-2026-04", "RULE:BR-TRI-003@v3", "CONTRA:C01"]
  trap: "The draft BRD v0.3 says the notice is due in 5 business days (C03); BR-FRD-012 and BR-FRD-019 are no longer in force."

