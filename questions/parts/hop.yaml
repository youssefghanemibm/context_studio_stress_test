- id: Q-HOP-013
  category: multi_hop
  dimensions: [multi_hop, txt, csv, json, code, connector]
  question: "The Sev1 incident that made the Q1 2025 NISA-TP2 return two days late: what change caused it, which code commit fixed it (ticket, author, date), and which program and copybook did that commit change?"
  expected_answer: "INC-2025-0412 was caused by CHUB-138, which widened the RSVMOVE field RM-AMOUNT from S9(9)V99 to S9(11)V99 COMP-3 so the GL adapter (CLX-IF-043) rejected every record. The code fix was commit CM-03, 'CHUB-142 CLRRS170/RSVMOVE: revert RM-AMOUNT to PIC S9(9)V99 COMP-3; add RM-REC-VERSION', authored by Keith Barraclough on 2025-04-30. It changed program CLRRS170 and copybook RSVMOVE (CHUB-143 and CHUB-144 were the other fix tickets)."
  acceptable_variants: []
  must_include: [["CHUB-138"], ["CHUB-142"], ["Keith Barraclough"], ["2025-04-30"], ["CLRRS170"], ["RSVMOVE"]]
  must_not_include: []
  evidence:
    - {fact_id: LD003-F034}          # Q1 2025 NISA-TP2 submitted 2025-05-07 instead of 2025-05-05 after INC-2025-0412 (pdf)
    - {fact_id: ST023-F002}          # INC-2025-0412 was Sev1 (csv)
    - {fact_id: TX004-F003}          # root cause CHUB-138 widened RM-AMOUNT (txt)
    - {fact_id: ST023-F003}          # INC-2025-0412 fixed under CHUB-142, 143, 144 (csv)
    - {fact_id: TX070-F048}          # CHUB-142 revert RSVMOVE RM-AMOUNT, add RM-REC-VERSION (json)
    - {fact_id: CODEMOD-F019}        # commit CM-03 by Keith Barraclough 2025-04-30 (git)
    - {fact_id: CL-RSVMOVE-F002}     # RSVMOVE.cpy RM-REC-VERSION added under CHUB-142 (code)
  hops: 5
  ask_mode: chat
  difficulty: hard
  world_refs: ["INCIDENT:INC-2025-0412", "TICKET:CHUB-142", "COMMIT:CM-03", "COPYBOOK:RSVMOVE#field_history"]
  trap: "CHUB-138 is the cause, not the fix; CHUB-143 and CHUB-144 are fix tickets without a world code commit."

- id: Q-HOP-014
  category: multi_hop
