  must_not_include: ["CLX-IF-027", "CLX-IF-028"]
  evidence:
    - {fact_id: ST035-F001}          # 043/044/047/049 dependsOn 042 (xml)
    - {fact_id: TX004-F002}          # incident bridge: consumers 043, 044, 047 (txt)
    - {fact_id: CODEMOD-F148}        # ADR-012: 042 records republished to claims.reserve.movement.v1 for reserve-engine (code md)
    - {fact_id: VS033-F022}          # hop 2: 051, 055, 058 (raster docx)
    - {fact_id: LD014-F007}          # 044 feeds 058 to the Actuarial Reserving Workbench (docx split)
    - {fact_id: VS033-F023}          # hop 3: NISA-TP2 and the Reserving team's IBNR run (raster docx)
  hops: 4
  ask_mode: graph
  difficulty: hard
  world_refs: ["INTERFACE:CLX-IF-042#dependents", "REPORT:NISA-TP2", "INTERFACE:CLX-IF-058#note"]
  trap: "CLX-IF-027 and CLX-IF-028 are upstream/sibling of CLX-IF-042, not downstream; the incident transcript names only three first-hop consumers (no CLX-IF-049, which went live later)."

