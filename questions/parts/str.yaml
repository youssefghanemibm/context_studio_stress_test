# Question group STR: structured data (ST001-ST060: CSV, XLSX, JSON, XML, YAML, wiki HTML).
# Every expected answer was checked against the text at each evidence locator (harness/extract.py),
# against the world model (world.worldlib) and, for aggregates, recomputed from the CSV files.

