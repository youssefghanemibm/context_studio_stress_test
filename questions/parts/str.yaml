# --------------------------------------------------------------------------------------------
- id: Q-STR-001
  category: hidden_merged
  dimensions: [xlsx, needle]
  question: "Has any column of CLR.T_CLAIM been retired according to the CLARA data dictionary? If so, which column, what was its data type, and when was it retired?"
  expected_answer: "Yes. The data dictionary's retired-columns list (the hidden '_retired' sheet) has one entry: CLR.T_CLAIM.LEGACY_SKADE_REF, CHAR(14), the claim reference in the Nordic SKADE-90 system, retired on 2024-05-31 together with SKADE-90."
  acceptable_variants:
    - "LEGACY_SKADE_REF, CHAR(14), retired 2024-05-31"
  must_include: [["LEGACY_SKADE_REF"], ["CHAR(14)", "CHAR 14", "14 characters", "14-character"], ["2024-05-31", "31 May 2024"]]
  must_not_include: []
  evidence:
    - {fact_id: ST001-F001}
    - {fact_id: ST001-F002}
    - {fact_id: ST001-F003}
  hops: 1
  ask_mode: chat
  difficulty: hard
  world_refs: ["TABLE:CLR.T_CLAIM#retired_columns"]
  trap: "The column is listed only on the hidden '_retired' sheet; the visible Columns sheet does not mention it."

