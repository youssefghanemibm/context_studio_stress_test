- id: Q-TRAP-001
  category: contradiction
  dimensions: [contradiction, temporal, txt, md, long_doc]
  question: "Since the fraud rules changed in autumn 2026, at what Sentinel score is a Tier-3 claim raised as a Fraud Referral?"
  expected_answer: "At a Sentinel score of 60 or more, from 1 October 2026. This was decided as DEC-014 at the Fraud Rules Workshop on 17 September 2026 and is BR-FRD-031 v2. The general threshold for all other claims stays at 65. The older v7.2 manual wording of 65 for all tiers is superseded for Tier-3 claims."
  acceptable_variants:
    - "60 or more for Tier-3 claims from 2026-10-01"
    - "A Sentinel score of 60 or above"
  must_include: [["60"]]
  must_not_include: ["for all tiers", "65 for all claims"]
  evidence:
    - {fact_id: TX002-F014}
    - {fact_id: TX031-F013}
  hops: 1
  ask_mode: chat
  difficulty: medium
  world_refs: [RULE:BR-FRD-031@v2#parameters.tier3_threshold, DECISION:DEC-014, CONTRA:C01]
  trap: "LD001 manual v7.2 (approved 2026-06-30) says 'Sentinel score is 65 or more, for all tiers'; the newer workshop decision DEC-014 lowers Tier-3 to 60 from 2026-10-01."

