  must_include: [["65"], ["60"], ["not correct", "incorrect", "wrong", "defect", "bug", "CHUB-298", "drift", "outdated", "out of date", "stale", "old value", "pre-2026"]]
  must_not_include: []
  evidence:
    - {fact_id: CL-CLRFR040-F001}
    - {fact_id: CL-T_PARAM_seed-F002}
    - {fact_id: TX031-F013}
  hops: 3
  ask_mode: chat
  difficulty: hard
  world_refs: [PROGRAM:CLRFR040#hardcoded_constants, TABLE:CLR.T_PARAM#param_rows:FRD_REFER_THRESH, RULE:BR-FRD-031@v2, CONTRA:C05]
  trap: "Code variant a hard-codes WS-REFER-THRESHOLD PIC 9(3) VALUE 070; a code-only reading answers 70. Ask before the CM-09 resync push; in variant c the constant is removed and the thresholds are read from CLR.T_PARAM."
