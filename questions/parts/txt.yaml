  expected_answer: "At a Sentinel score of 60 or more. From 1 October 2026 BR-FRD-031 v2 (decision DEC-014 at the Fraud Rules Workshop on 17 September 2026) refers Tier-3 claims at 60 or more, while the general threshold for other claims stays at 65. The Claims Handling Manual v7.2 (approved 30 June 2026) still says 65 for all claims, but that predates the decision and is superseded for Tier-3."
  acceptable_variants: []
  must_include: [["60"]]
  must_not_include: ["65 for all claims", "65 for all tiers"]
