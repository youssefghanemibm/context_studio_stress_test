# Question part: TXT group (text family TX001-TX075: transcripts, emails, minutes, decision log,
# Jira export TX070, chat export TX071, email thread TX072, NISA letter TX073, newsletter TX074).
# Every expected answer was checked against the text at each evidence locator (harness/extract.py)
# and against the world model (world.worldlib as-of helpers).
# Jira questions are anchored to the TX070 export date (2026-11-11): in the world, CHUB-298, CHUB-415
# and CHUB-421 became Done on 2026-11-12 (code variant c, commit CM-09).
# TX070 and ST024 are two snapshots of the same Jira project on the same date and agree ticket by ticket.

- id: Q-TXT-001
  category: contradiction
  dimensions: [txt, contradiction, temporal, long_doc]
  question: "At the Programme Skerry steering committee on 8 October 2026, what Wave 2 cut-over date was confirmed?"
  expected_answer: "15 February 2027 (2027-02-15), recorded as DEC-011. The 18 January 2027 date shown earlier in the meeting came from an old draft plan and was declared void."
  acceptable_variants: ["2027-02-15", "Monday 15 February 2027"]
  must_include: [["2027-02-15", "15 February 2027"]]
  must_not_include: ["2027-01-18", "18 January"]
  evidence:
    - {fact_id: TX001-F008}
    - {fact_id: TX001-F009}
    - {fact_id: TX001-F007}
  hops: 1
  ask_mode: chat
  difficulty: medium
  world_refs: ["DECISION:DEC-011", "CONTRA:C15", "WAVE:MW-2"]
  trap: "At 00:41 Arjun Kesavan reads 18 January 2027 off an old draft slide; Aisha Siddiqui corrects it at 00:44. Retrieval of the 00:41 chunk alone gives the void date."

