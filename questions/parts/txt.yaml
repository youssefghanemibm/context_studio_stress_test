  expected_answer: "About 41% more referrals on the current run-rate. The option of lowering the general threshold to 60 for all claims was rejected (DEC-016), because SIU could not absorb the volume within the 3-business-day triage standard and too many genuine customers would get additional-checks letters."
  acceptable_variants: []
  must_include: [["41%"], ["reject", "turned down", "off the table", "ruled out", "not adopted", "dropped"]]
  must_not_include: []
  evidence:
    - {fact_id: TX002-F009}
    - {fact_id: TX002-F010}
    - {fact_id: TX031-F015}
  hops: 2
  ask_mode: chat
  difficulty: medium
  world_refs: ["DECISION:DEC-016#impact_estimate"]
  trap: "The 41% estimate exists only in the TX002 transcript at 00:55:02; the minutes (TX031) and decision log (TX038) record DEC-016 without the number. In TX002 the estimate (00:55:02) and the rejection (00:55:30) sit about 28 seconds apart."

